name: Unpack FocalTrace Project

on:
  push:
    paths:
      - "FocalTrace-Graph-Hacks.zip"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o FocalTrace-Graph-Hacks.zip
          cp -R focaltrace/. .
          rm -rf focaltrace FocalTrace-Graph-Hacks.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add FocalTrace project source"
          git push
